<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" fill="none" role="img" aria-label="School logo">
  <defs>
    <linearGradient id="sunGrad" x1="12" y1="10" x2="29" y2="30" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffd98a"/><stop offset=".55" stop-color="#ffc247"/><stop offset="1" stop-color="#ff9d2e"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="6" y1="24" x2="34" y2="31" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2ee6b0"/><stop offset="1" stop-color="#10a97c"/>
    </linearGradient>
    <clipPath id="discClip"><circle cx="20" cy="18.2" r="9.6"/></clipPath>
  </defs>

  <!-- energy loop -->
  <path d="M5.5 24.2Q20 33.4 34.5 24.2" stroke="url(#leafGrad)" stroke-width="2.1" stroke-linecap="round"/>

  <!-- sun rays -->
  <g stroke="url(#sunGrad)" stroke-width="1.8" stroke-linecap="round">
    <path d="M20 2.6v3.2"/>
    <path d="M9.4 6.4l2.2 2.3"/>
    <path d="M30.6 6.4l-2.2 2.3"/>
    <path d="M4 16.2l3.1.9"/>
    <path d="M36 16.2l-3.1.9"/>
  </g>

  <!-- solar disc -->
  <circle cx="20" cy="18.2" r="9.6" fill="url(#sunGrad)"/>
  <g clip-path="url(#discClip)" stroke="#06232b" stroke-width="1.05" opacity=".45">
    <path d="M10.4 13.2h19.2M10.4 18.2h19.2M10.4 23.2h19.2"/>
    <path d="M14.6 8.6v19.2M20 8.6v19.2M25.4 8.6v19.2"/>
  </g>
</svg>
